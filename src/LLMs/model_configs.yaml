# LLM Model Configurations
# Define model settings for different task types and providers

basic:  # Fast, cheap for low-risk factual queries
  groq:
    model: "openai/gpt-oss-20b"
    temperature: 0.0
  openai:
    model: "gpt-3.5-turbo"
    temperature: 0.0

reasoning:  # More capable for medium-risk analysis
  groq:
    model: "openai/gpt-oss-120b"
    temperature: 0.1
  openai:
    model: "openai/gpt-oss-20b"
    temperature: 0.1

complex:  # High capability for high-risk or complex reasoning
  groq:
    model: "openai/gpt-oss-120b"
    temperature: 0.2
  openai:
    model: "openai/gpt-4o"
    temperature: 0.2

judge:  # LLM-as-a-judge (different family from generator)
  groq:
    model: "qwen/qwen3.8-27b"
    temperature: 0.0
  openai:
    model: "gpt-4o"
    temperature: 0.0